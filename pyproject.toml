[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcn-wizard"
version = "0.1.0"
description = "IBKR-based FCN screening and decision support dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ib_insync",
  "numpy",
  "pandas",
  "scipy",
  "streamlit",
]

[tool.setuptools.packages.find]
where = ["src"]
